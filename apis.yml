aid: panorama-education
name: Panorama Education
description: >-
  Panorama Education is a K-12 education technology company whose student success
  platform is used by thousands of school districts to turn student data into
  action across academics and behavior (MTSS/RTI), universal screening, social-
  emotional learning (SEL) and survey instruments, attendance, graduation
  planning, and family and staff engagement. The platform ingests data nightly
  from 24+ student information systems, learning management systems, and 100+
  benchmark and state assessments using the OneRoster standard and secure file
  transfer. Panorama does not publish a public self-service developer API;
  integrations are delivered as managed B2B data synchronization. The company is
  SOC 2 Type 2 attested, 1EdTech Data Privacy certified, ESSA Level II/IV rated,
  and a Student Privacy Pledge signatory (FERPA/COPPA/PPRA/CCPA aligned).
